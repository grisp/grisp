name: On Grisp Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  trigger-otp-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Trigger OTP package build
        env:
          GRISP_VERSION: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/erlang/otp/master/otp_versions.table \
          | grep '^OTP-' \
          | cut -d' ' -f1 \
          | sed 's/OTP-//' \
          | sort -V \
          | awk -F. '{
            major_version = $1;
            latest[major_version] = $0;
          }
          END {
            for (m in latest) print latest[m];
          }' \
          | sort -Vr \
          | head -n 4 \
          | while read -r OTP_VER; do
            echo "Triggering for OTP: $OTP_VER"
            curl --fail-with-body -L -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.everest-preview+json" \
              https://api.github.com/repos/grisp/grisp/dispatches \
              -d "$(jq -cn --arg otp "$OTP_VER" --arg grisp "$GRISP_VERSION" \
                '{event_type: "grisp-release", client_payload: {otp: $otp, grisp: $grisp, unit: false, integration: true}}')"
          done

